name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: adagio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -t backend
        env:
          ADAGIO_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/adagio
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix frontend ci || npm --prefix frontend install
      - run: npm --prefix frontend run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/markadagio/adagio-backoffice:latest
            ghcr.io/markadagio/adagio-backoffice:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
